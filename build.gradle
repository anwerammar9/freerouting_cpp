plugins {
    id 'java'
    id 'application'
}

group = 'app.freerouting'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Google Gson for JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Apache Log4j2 for logging
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'
    
    // Testing (optional - no Java tests exist yet)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            includes = ['**/*.xml', '**/*.properties', '**/*.json']
        }
    }
}

application {
    mainClass = 'app.freerouting.Freerouting'
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'app.freerouting.Freerouting',
            'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' ')
        )
    }
}

task copyDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into 'build/libs/lib'
}

jar.dependsOn copyDependencies

// Run with: ./gradlew run --args="<dsn_file>"
run {
    standardInput = System.in
}