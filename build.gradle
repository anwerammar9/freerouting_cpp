plugins {
    id 'java'
    id 'application'
}

group = 'app.freerouting'
version = '2.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    // Core dependencies
    implementation 'org.apache.logging.log4j:log4j-core:2.26.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'com.google.code.gson:gson:2.14.0'
    
    // Jakarta EE dependencies (required by Jersey/Log4j2)
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'jakarta.annotation:jakarta.annotation-api:3.0.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.1'
    
    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = ['src']
            includes = ['**/*.xml', '**/*.properties', '**/*.json']
            exclude '**/.vscode/**'
            exclude '**/build/**'
        }
    }
}

application {
    mainClass = 'app.freerouting.Freerouting'
}

tasks.named('compileJava') {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation' << '-Xmaxerrs' << '1000' << '-Xmaxwarns' << '1000'
}

tasks.named('processResources') {
    includeEmptyDirs = false
}

tasks.withType(AbstractCopyTask).configureEach {
    filePermissions { }
    dirPermissions { }
}

tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'app.freerouting.Freerouting',
            'Class-Path': configurations.runtimeClasspath.files.collect { "lib/$it.name" }.join(' ')
        )
    }
}

task copyDependencies {
    def libDir = layout.buildDirectory.dir('libs/lib')
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(libDir)
    doLast {
        def targetDir = libDir.get().asFile
        targetDir.mkdirs()
        configurations.runtimeClasspath.files.each { f ->
            java.nio.file.Files.copy(
                f.toPath(),
                new File(targetDir, f.name).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

jar.dependsOn copyDependencies

run {
    standardInput = System.in
}